[package]
name = "sensorpanel-client"
version = "0.1.0"
edition = "2021"
description = "Native sensor panel client: libmpv video underlay + Slint overlay"

[dependencies]
anyhow = "1"
libmpv2 = { version = "6", features = ["render"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030", "raw-window-handle-06", "image-default-formats"] }
raw-window-handle = "0.6"
regex-lite = "0.1"
tungstenite = "0.30"
ureq = { version = "3", features = ["json"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
lto = "thin"
strip = true
